name: Deploy

on:
  push:
    branches: [main]
  # 失敗したデプロイの再実行や、コード変更なしで再デプロイしたい場合の手動トリガー
  workflow_dispatch:

# 連続 push でデプロイが並走すると、後発の古いビルドが先に完了して
# 新しいものを上書きしうる。ジョブは直列化し、実行中のものは止めない
# （途中で止めると Worker が中途半端な状態になりうるため cancel はしない）。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # mise.toml は node = "lts" で版が固定されず、setup-node も mise.toml を
          # 読めない（対応しているのは .nvmrc / .node-version / .tool-versions / package.json）。
          # ローカルの v24 系に合わせてメジャーで固定する。
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # cloudflare/wrangler-action ではなく npx で叩く。action は自前で wrangler を
      # 取ってくるため、package.json で固定した wrangler / @cloudflare/vite-plugin
      # （3067bd4 でデプロイが壊れてピン留めした経緯あり）と版がずれる。
      # npx はローカルの node_modules を優先するので手元の `npm run deploy` と同一になる。
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
